# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
name: CI

on:
  # Gate every branch, not only main (kept from the previous workflow: feature branches
  # without a PR were otherwise untested).
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported (requires-python), the release the previous workflow tested (3.12)
        # and the current release.
        python-version: ["3.10", "3.12", "3.13"]
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
    with:
      python-version: ${{ matrix.python-version }}
      # Offline pytest suite, then the CLI smoke the previous workflow ran (synthetic fixture only).
      test-command: |
        python -m pytest -q
        book-procurement-data contract > /dev/null
        book-procurement-data validate src/book_procurement_data/demo.json
        book-procurement-data demo --open-only > /dev/null

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
