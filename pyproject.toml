[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-procurement-data"
version = "0.1.0"
description = "Find buyer requests with vendor qualification and bid requirements."
requires-python = ">=3.10"
dependencies = ["jsonschema==4.19.2"]

[project.scripts]
book-procurement-data = "book_procurement_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
book_procurement_data = ["*.json"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.format]
# Vendored, byte-identical across the sibling book-*-data repos: cli.py is SHA-256 pinned by
# tests/test_shared_cli.py, which is itself copied unchanged to every sibling. Formatting cli.py
# breaks that check, so reformat them only together, in every sibling, with the pins updated.
exclude = ["src/*/cli.py", "tests/test_shared_cli.py"]

[tool.ruff.lint]
# Correctness, import order and modern syntax; the compact one-line test style is kept.
select = ["E4", "E9", "F", "I", "B", "UP"]
